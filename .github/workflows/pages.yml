name: Deploy viewer (Cloudflare Pages + GitHub Pages mirror)

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml", ".github/scripts/site_size.py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install dwebp (story-centre depth check decodes real tiles)
        run: sudo apt-get update -q && sudo apt-get install -y -q webp
      - run: npm test
      - run: npm run build
      - name: Check that tiles made it into the build
        run: |
          test -f dist/tiles/meta.json
          echo "dem tiles: $(find dist/tiles/dem -name '*.webp' | wc -l)"
          echo "coverage tiles: $(find dist/tiles/coverage -name '*.webp' | wc -l)"
          du -sh dist
      - name: Site size guard (Pages limit 1 GB; warn > 750 MB, fail > 950 MB)
        run: python3 ../.github/scripts/site_size.py dist --warn-mb 750 --fail-mb 950
      # seaflooratlas.org is served by Cloudflare Pages (project seafloor-atlas) since 2026-11-18: GitHub Pages was
      # slow and erratic from Central Asia (16 first-view tiles: 0.7-19 s vs 0.7-1.2 s). GitHub Pages stays as a
      # mirror. Needs the repository secret CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit); skipped without it.
      # Only changed files are uploaded (Pages deduplicates by content hash). Limits: 20,000 files, 25 MiB per file.
      - name: Check Cloudflare Pages limits (20,000 files, 25 MiB per file)
        run: |
          n=$(find dist -type f | wc -l); echo "files: $n"; test "$n" -le 20000
          big=$(find dist -type f -size +25M); if [ -n "$big" ]; then echo "over 25 MiB: $big"; exit 1; fi
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 95c89337261f10f37ac1310191b2ebb7
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::warning::CLOUDFLARE_API_TOKEN not set: Cloudflare Pages (the live site) was NOT updated"; exit 0; fi
          npx --yes wrangler@4.164.0 pages deploy dist --project-name seafloor-atlas --branch main --commit-hash "$GITHUB_SHA" --commit-message "$(git log -1 --format=%s | head -c 200)"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
