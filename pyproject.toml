[project]
name = "seafloor-atlas"
version = "0.1.0"
description = "Whole-Earth seafloor map from GEBCO_2026: web tiles, measured-coverage statistics, figures"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1",
  "rasterio>=1.4",
  "pillow>=11",
  "matplotlib>=3.10",
  "cartopy>=0.24",
  "cmocean>=3",
  "scipy>=1.14",
  "pytest>=8",
]
[tool.uv]
package = false
