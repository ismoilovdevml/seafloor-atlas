[project]
name = "seafloor-atlas"
version = "0.1.0"
description = "Whole-Earth seafloor map from GEBCO_2026: web tiles, measured-coverage statistics, figures"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1",
  "rasterio>=1.4",
  "pillow>=11",
  "matplotlib>=3.10",
  "cartopy>=0.24",
  "cmocean>=3",
  "scipy>=1.14",
  "pytest>=8",
  "gsw>=3.6",
  "netCDF4>=1.7",
  "duckdb>=1.1",
  "h3>=4.1",
  "pyarrow>=17",
]
[tool.uv]
package = false
